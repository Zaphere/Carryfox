kind = "web"
previewPath = "/"
title = "Carryfox.at"
version = "1.0.0"
id = "artifacts/carryfox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25806

[services.development]
run = "pnpm --filter @workspace/carryfox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/carryfox", "run", "build" ]
publicDir = "artifacts/carryfox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25806"
BASE_PATH = "/"
