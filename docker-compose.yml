# Carryfox production stack — see DEPLOY.md for the full Hostinger guide.
#
#   docker compose up -d --build                build + start everything
#   (DB schema migrations run automatically as the `migrate` one-shot)
#
# Configuration comes from the repo-root .env (copy .env.example → .env).

name: carryfox

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carryfox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (use letters and numbers only)}
      POSTGRES_DB: ${POSTGRES_DB:-future_freight}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-carryfox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-future_freight}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ADMIN_OWNER_EMAIL: ${ADMIN_OWNER_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional WhatsApp Cloud API — leave empty to disable.
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-}
    depends_on:
      db:
        condition: service_healthy
      # Wait for the schema migration one-shot so a fresh deploy always has
      # tables before the API starts accepting traffic.
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Schema migration one-shot: runs automatically on every `docker compose up`
  # (the api service waits for it via depends_on). Idempotent — drizzle-kit
  # push creates missing tables and applies additive changes on each deploy.
  migrate:
    build:
      context: .
      target: builder
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    restart: "no"
    command: sh -c "cd lib/db && npx drizzle-kit push --force --config ./drizzle.config.ts"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carryfox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-future_freight}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
