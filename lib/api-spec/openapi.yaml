openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Carryfox.at Logistics & Moving Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Booking operations
  - name: quotes
    description: Quote operations
  - name: vehicles
    description: Fleet & vehicle operations
  - name: drivers
    description: Driver operations
  - name: tracking
    description: Real-time tracking operations
  - name: services
    description: Service catalog
  - name: dashboard
    description: Dashboard summary & analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── QUOTES ──────────────────────────────────────────────────────────────────
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List all quotes
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a new quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get quote by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "404":
          description: Not found

  # ── BOOKINGS ─────────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ── DRIVERS ──────────────────────────────────────────────────────────────────
  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List all drivers
      responses:
        "200":
          description: List of drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"

  /drivers/{id}:
    get:
      operationId: getDriver
      tags: [drivers]
      summary: Get driver by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Driver"

  # ── VEHICLES ─────────────────────────────────────────────────────────────────
  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all fleet vehicles
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  # ── TRACKING ─────────────────────────────────────────────────────────────────
  /tracking/{bookingId}:
    get:
      operationId: getTracking
      tags: [tracking]
      summary: Get real-time tracking data for a booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingInfo"
        "404":
          description: Not found

  /tracking/active:
    get:
      operationId: listActiveTracking
      tags: [tracking]
      summary: List all currently active shipments with tracking info
      responses:
        "200":
          description: Active tracking list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackingInfo"

  # ── SERVICES ─────────────────────────────────────────────────────────────────
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List available moving/logistics services
      responses:
        "200":
          description: Service catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  # ── DASHBOARD ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get operations dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-bookings:
    get:
      operationId: getRecentBookings
      tags: [dashboard]
      summary: Get recent bookings activity feed
      responses:
        "200":
          description: Recent bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /dashboard/fleet-status:
    get:
      operationId: getFleetStatus
      tags: [dashboard]
      summary: Get live fleet status breakdown
      responses:
        "200":
          description: Fleet status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetStatus"

  /dashboard/analytics:
    get:
      operationId: getDashboardAnalytics
      tags: [dashboard]
      summary: Get revenue and booking analytics over time
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── QUOTE ─────────────────────────────────────────────────────────────────
    Quote:
      type: object
      required: [id, customerName, customerEmail, customerPhone, pickupAddress, destinationAddress, apartmentSize, rooms, floorPickup, floorDestination, hasElevator, needsStorage, needsPacking, needsAssembly, urgencyLevel, estimatedPrice, estimatedTruckSize, estimatedCrew, status, createdAt]
      properties:
        id:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        apartmentSize:
          type: string
          description: "e.g. studio, 1br, 2br, 3br, 4br+"
        rooms:
          type: integer
        floorPickup:
          type: integer
        floorDestination:
          type: integer
        hasElevator:
          type: boolean
        needsStorage:
          type: boolean
        needsPacking:
          type: boolean
        needsAssembly:
          type: boolean
        urgencyLevel:
          type: string
          description: "standard, express, emergency"
        estimatedPrice:
          type: number
        estimatedTruckSize:
          type: string
        estimatedCrew:
          type: integer
        status:
          type: string
          description: "pending, accepted, booked, cancelled"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    QuoteInput:
      type: object
      required: [customerName, customerEmail, customerPhone, pickupAddress, destinationAddress, apartmentSize, rooms, floorPickup, floorDestination, hasElevator, needsStorage, needsPacking, needsAssembly, urgencyLevel]
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        apartmentSize:
          type: string
        rooms:
          type: integer
        floorPickup:
          type: integer
        floorDestination:
          type: integer
        hasElevator:
          type: boolean
        needsStorage:
          type: boolean
        needsPacking:
          type: boolean
        needsAssembly:
          type: boolean
        urgencyLevel:
          type: string
        notes:
          type: string

    # ── BOOKING ───────────────────────────────────────────────────────────────
    Booking:
      type: object
      required: [id, quoteId, customerName, customerEmail, customerPhone, pickupAddress, destinationAddress, scheduledDate, status, serviceType, vehicleId, driverId, totalPrice, createdAt]
      properties:
        id:
          type: integer
        quoteId:
          type: ["integer", "null"]
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        scheduledDate:
          type: string
          format: date-time
        status:
          type: string
          description: "confirmed, crew_assigned, loading, on_route, arriving, completed, cancelled"
        serviceType:
          type: string
          description: "apartment_move, student_move, office_move, storage, furniture, clearance, packing, warehouse"
        vehicleId:
          type: ["integer", "null"]
        driverId:
          type: ["integer", "null"]
        totalPrice:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    BookingInput:
      type: object
      required: [customerName, customerEmail, customerPhone, pickupAddress, destinationAddress, scheduledDate, serviceType, totalPrice]
      properties:
        quoteId:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        scheduledDate:
          type: string
          format: date-time
        serviceType:
          type: string
        vehicleId:
          type: integer
        driverId:
          type: integer
        totalPrice:
          type: number
        notes:
          type: string

    BookingUpdate:
      type: object
      properties:
        status:
          type: string
        scheduledDate:
          type: string
          format: date-time
        vehicleId:
          type: integer
        driverId:
          type: integer
        notes:
          type: string

    # ── DRIVER ────────────────────────────────────────────────────────────────
    Driver:
      type: object
      required: [id, name, phone, email, licenseNumber, status, rating, totalMoves, city, avatarUrl, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        licenseNumber:
          type: string
        status:
          type: string
          description: "available, on_route, off_duty, break"
        rating:
          type: number
        totalMoves:
          type: integer
        city:
          type: string
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── VEHICLE ───────────────────────────────────────────────────────────────
    Vehicle:
      type: object
      required: [id, plateNumber, model, type, capacity, status, currentCity, fuelLevel, mileage, lastServiceDate, createdAt]
      properties:
        id:
          type: integer
        plateNumber:
          type: string
        model:
          type: string
        type:
          type: string
          description: "van, small_truck, large_truck, xl_truck"
        capacity:
          type: string
          description: "e.g. 3.5t, 7.5t, 12t"
        status:
          type: string
          description: "available, on_route, maintenance, idle"
        currentCity:
          type: string
        currentLat:
          type: ["number", "null"]
        currentLng:
          type: ["number", "null"]
        fuelLevel:
          type: integer
          description: "0-100 percentage"
        mileage:
          type: integer
        lastServiceDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    # ── TRACKING ──────────────────────────────────────────────────────────────
    TrackingInfo:
      type: object
      required: [bookingId, status, driverName, driverPhone, vehiclePlate, pickupAddress, destinationAddress, estimatedArrival, distanceRemaining, currentSpeed, currentLat, currentLng, routeProgress, weatherCondition, updatedAt]
      properties:
        bookingId:
          type: integer
        status:
          type: string
          description: "confirmed, crew_assigned, loading, on_route, arriving, completed"
        driverName:
          type: string
        driverPhone:
          type: string
        vehiclePlate:
          type: string
        pickupAddress:
          type: string
        destinationAddress:
          type: string
        estimatedArrival:
          type: string
          format: date-time
        distanceRemaining:
          type: number
          description: "km"
        currentSpeed:
          type: number
          description: "km/h"
        currentLat:
          type: number
        currentLng:
          type: number
        routeProgress:
          type: integer
          description: "0-100 percentage"
        weatherCondition:
          type: string
        hasTrafficDelay:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    # ── SERVICE ───────────────────────────────────────────────────────────────
    Service:
      type: object
      required: [id, key, name, description, basePrice, estimatedDuration, icon, features]
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
        description:
          type: string
        basePrice:
          type: number
        estimatedDuration:
          type: string
        icon:
          type: string
        features:
          type: array
          items:
            type: string

    # ── DASHBOARD ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalBookingsToday, activeVehicles, totalDrivers, avgEtaMinutes, customerSatisfaction, totalMovesAllTime, totalRevenueMTD, pendingBookings, completedToday]
      properties:
        totalBookingsToday:
          type: integer
        activeVehicles:
          type: integer
        totalDrivers:
          type: integer
        avgEtaMinutes:
          type: integer
        customerSatisfaction:
          type: number
        totalMovesAllTime:
          type: integer
        totalRevenueMTD:
          type: number
        pendingBookings:
          type: integer
        completedToday:
          type: integer

    FleetStatus:
      type: object
      required: [available, onRoute, maintenance, idle, total]
      properties:
        available:
          type: integer
        onRoute:
          type: integer
        maintenance:
          type: integer
        idle:
          type: integer
        total:
          type: integer

    AnalyticsDataPoint:
      type: object
      required: [label, bookings, revenue]
      properties:
        label:
          type: string
        bookings:
          type: integer
        revenue:
          type: number

    AnalyticsData:
      type: object
      required: [monthly, bookingsByService]
      properties:
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDataPoint"
        bookingsByService:
          type: array
          items:
            $ref: "#/components/schemas/ServiceBreakdown"

    ServiceBreakdown:
      type: object
      required: [service, count]
      properties:
        service:
          type: string
        count:
          type: integer
